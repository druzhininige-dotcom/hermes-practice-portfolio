slug: ai
name: "ИИ-агенты и автоматизация"
tag: "#ии"
threshold: 5.0
prompt_version: "ai-v2"
is_active: true
tg_group_id: 0
tg_topic_id: 0

services: |
  Внедрение ИИ-агентов и автоматизации для бизнеса: чат-боты в Telegram, автоответы
  на отзывы и вопросы (WB/Ozon/ЯМ), интеграции с n8n/Make, связка CRM + мессенджеры,
  обработка заявок, парсинг и аналитика, ассистенты на базе LLM под конкретный процесс.

looking_for: |
  Те, кому НУЖЕН исполнитель: «нужен бот», «кто сделает автоматизацию», «хочу
  внедрить ИИ», «нужна интеграция с n8n», «автоответы на отзывы», «нужен агент,
  который отвечает клиентам», «кто настроит нейросеть для бизнеса».

keywords:
  - ии-агент
  - ии агент
  - ai-агент
  - чат-бот
  - чат бот
  - телеграм бот
  - бот для телеграм
  - автоматизировать
  - автоматизация процессов
  - n8n
  - make.com
  - автоответ на отзывы
  - автоответы на отзывы
  - нейросеть для бизнеса
  - внедрить ии
  - внедрение ии
  - интеграция с crm
  - парсинг
  - gpt
  - llm

weak_keywords:
  - бот
  - автоматизация
  - нейросеть

not_lead: |
  Курсы, обучение, вебинары, «научу делать ботов», марафоны по ИИ. Разработчики и
  студии, которые сами рекламируют услуги и ищут клиентов. Вопросы «что такое
  ChatGPT», «какая нейросеть лучше для картинок», «как установить n8n» без запроса
  исполнителя и без бизнес-задачи.

stopwords:
  - курс
  - обучение
  - вебинар
  - марафон
  - бесплатный урок
