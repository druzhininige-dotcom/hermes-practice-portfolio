slug: mp
name: "Специалист по маркетплейсам"
tag: "#маркетплейсы"
threshold: 5.0
prompt_version: "mp-v2"
is_active: true
tg_group_id: 0
tg_topic_id: 0

services: |
  Ведение кабинета Wildberries / Ozon / Яндекс.Маркет под ключ: оформление и SEO
  карточек, инфографика, реклама (трафареты, ставки, ДРР), аналитика продаж и
  юнит-экономики, аудит кабинета, выход на новый маркетплейс, поставки и FBS.

looking_for: |
  Селлеры, владельцы магазинов и компании, которым НУЖЕН человек/подрядчик на
  маркетплейсы: «ищу менеджера», «кто ведёт кабинет», «нужна помощь с карточками»,
  «кто сделает аудит», «нужно выйти на Ozon/ЯМ», «кто возьмёт в работу».

keywords:
  - менеджер маркетплейс
  - менеджера маркетплейс
  - специалист по маркетплейс
  - ведение кабинета
  - ведение wb
  - ведение ozon
  - ведение wildberries
  - оформление карточек
  - карточки товара
  - инфографика
  - seo карточек
  - аудит кабинета
  - аудит магазина
  - выход на ozon
  - выход на маркетплейс
  - помощь селлеру
  - продвижение на wb
  - реклама на wb
  - трафареты
  - юнит-экономика

weak_keywords:
  - wb
  - ozon
  - озон
  - вайлдберриз
  - wildberries
  - яндекс маркет
  - маркетплейс
  - селлер
  - карточка товара

not_lead: |
  Сами специалисты и агентства, которые предлагают услуги («ведём кабинеты»,
  «делаем карточки», «беру магазины на ведение») и ищут клиентов. Соискатели,
  которые ищут работу («ищу работу менеджером маркетплейсов», «резюме», «опыт 3 года»).
  Вопросы про комиссии, тарифы, штрафы, логистику площадки без запроса исполнителя.
  Запросы только на инструмент для кабинета (бот, автоответы, парсер, отчёт) при словах
  «кабинет ведём сами» — это профиль ai, человек на кабинет не ищется.

stopwords:
  - ищу работу
  - резюме
  - вакансия
  - требуется менеджер
  - зарплата
