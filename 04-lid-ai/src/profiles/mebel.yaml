slug: mebel
name: "Смета и проект мебели"
tag: "#мебель"
threshold: 5.0
prompt_version: "mebel-v2"
is_active: true

# id группы и топика — заполнить после создания топиков (0 = не задан)
tg_group_id: 0
tg_topic_id: 0

services: |
  Расчёт и проектирование корпусной мебели на заказ: смета по раскрою (ЛДСП, кромка,
  распил, фурнитура, монтаж), дизайн-проект кухни/шкафа/гардеробной, 3D-визуализация,
  карта раскроя, подготовка проекта для цеха. Работа по РФ, замер и проект дистанционно
  по фото/размерам; для монтажа — свой цех/партнёры.

looking_for: |
  Частные лица и дизайнеры, которым НУЖЕН расчёт, проект, 3D-визуализация или раскрой
  корпусной мебели: кухня, шкаф, гардеробная, тумба, стол, мебель в нишу. Ищут, кто
  посчитает стоимость по размерам, нарисует проект, сделает 3D, подготовит раскрой.

keywords:
  - смета мебели
  - смета на мебель
  - смета на кухню
  - смета кухни
  - смета на шкаф
  - смета шкафа
  - расчёт мебели
  - расчёт кухни
  - стоимость кухни
  - рассчитать шкаф
  - рассчитать кухню
  - посчитать кухню
  - посчитать шкаф
  - проект кухни
  - проект шкафа
  - дизайн-проект кухни
  - 3d проект
  - 3д проект
  - визуализация кухни
  - раскрой
  - карта раскроя
  - корпусная мебель
  - мебель на заказ
  - дизайнер мебели
  - замер
  - гардеробная
  - кухонный гарнитур
  - шкаф в нишу

# Слова, которые сами по себе не делают сообщение лидом, но и не блокируют
weak_keywords:
  - кухня
  - шкаф
  - мебель
  - тумба
  - столешница
  - лдсп

not_lead: |
  Мебельные цеха, мастерские, конструкторы и дизайнеры, которые САМИ рекламируют
  свои услуги («делаем кухни на заказ», «раскрой и кромка», «принимаем заказы»),
  публикуют прайсы, ищут заказы или работников. Вопросы «из чего лучше сделать»,
  «какой материал выбрать», «сколько стоит ЛДСП в магазине» без запроса исполнителя.

stopwords:
  - продам
  - продаю
  - сдам
  - аренда помещения
  - куплю станок
