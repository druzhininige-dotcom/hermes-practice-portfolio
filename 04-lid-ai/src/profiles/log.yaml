not_lead: |
  Карго-компании, логисты, брокеры и закупщики, которые САМИ рекламируют услуги
  («возим из Китая», «выкуп 5%», «сборные грузы по расписанию»), публикуют тарифы
  и ищут клиентов. Вопросы «сколько идёт посылка из Китая» из любопытства, трек
  чужой посылки, жалобы на задержки без запроса исполнителя.

