services: |
  Белый ввоз из Китая в РФ под ключ: выкуп с 1688/Taobao/Alibaba, консолидация,
  сборные грузы и контейнеры, карго, таможенное оформление, сертификация, доставка
  до склада. Подбор товара и поставщика в Китае, проверка фабрики, образцы,
  малые партии и тестовые закупки.

looking_for: |
  Те, кто ищет исполнителя по Китаю: «кто выкупит», «нужен карго», «подскажите
  поставщика», «кто возит из Китая», «нужна растаможка», «ищу брокера», «кто
  поможет с 1688», «нужен белый ввоз», «сколько стоит привезти».

