# Тестовые сообщения для калибровки: 2 положительных + 2 отрицательных на профиль,
# плюс 2 перекрёстных. Формулировки — как в живых чатах.
# expect_secondary — профиль, который тоже должен попасть в карточку (перекрёстный случай).

- id: mebel_pos_1
  profile: mebel
  expect_lead: true
  text: >
    Ребята, нужна смета на кухню 3,6 метра, размеры и фото есть. Кто посчитает
    материалы, распил и кромку? Нужна нормальная смета, а не «примерно».

- id: mebel_pos_2
  profile: mebel
  expect_lead: true
  text: >
    Ищу кто нарисует 3D проект гардеробной в нишу 2,4 на 0,6, размеры есть.
    Нужен проект с раскроем, чтобы отдать в цех.

- id: mebel_neg_1
  profile: mebel
  expect_lead: false
  text: >
    Делаем кухни на заказ, свой цех, распил и кромка, принимаем заказы по городу.
    Прайс в закрепе, пишите в ЛС.

- id: mebel_neg_2
  profile: mebel
  expect_lead: false
  text: >
    Подскажите, какой ЛДСП лучше для кухни — 16 или 18 мм? И чем отличается
    влагостойкий от обычного?

- id: mp_pos_1
  profile: mp
  expect_lead: true
  text: >
    Ищем менеджера на WB, два магазина, нужен полный цикл: карточки, реклама,
    аналитика. Оплата от результата, обсуждаем.

- id: mp_pos_2
  profile: mp
  expect_lead: true
  text: >
    Кто может сделать аудит кабинета Ozon? 40 SKU, продажи падают третий месяц,
    нужен разбор и план, что чинить.

- id: mp_neg_1
  profile: mp
  expect_lead: false
  text: >
    Я специалист по маркетплейсам, веду 5 магазинов, есть кейсы по росту.
    Беру ещё один магазин на ведение, пишите.

- id: mp_neg_2
  profile: mp
  expect_lead: false
  text: >
    Какая комиссия у Ozon в категории одежда и сколько стоит логистика?
    Никак не пойму, как считать.

- id: log_pos_1
  profile: log
  expect_lead: true
  text: >
    Кто занимается выкупом с 1688? Нужна тестовая партия 50 кг в Москву,
    интересует карго и белый ввоз, подскажите по цене.

- id: log_pos_2
  profile: log
  expect_lead: true
  text: >
    Нужен поставщик в Китае на солнечные панели, полный цикл под ключ:
    выкуп, доставка, растаможка. Работаем по РФ.

- id: log_neg_1
  profile: log
  expect_lead: false
  text: >
    Возим из Китая сборные грузы, выкуп 5%, белый ввоз, тарифы в закрепе.
    Работаем с юрлицами, пишите в ЛС.

- id: log_neg_2
  profile: log
  expect_lead: false
  text: >
    Сколько сейчас идёт посылка из Китая до Москвы? У меня трек завис
    на экспорте уже неделю.

- id: ai_pos_1
  profile: ai
  expect_lead: true
  text: >
    Нужен телеграм-бот под ключ: приём заявок, ответы клиентам и передача
    в Битрикс24. Кто делает и сколько стоит?

- id: ai_pos_2
  profile: ai
  expect_lead: true
  text: >
    Хочу автоматизировать ответы на отзывы в WB через n8n и GPT. Есть кто
    с опытом такой связки? Нужен исполнитель, не совет.

- id: ai_neg_1
  profile: ai
  expect_lead: false
  text: >
    Запускаю курс по нейросетям, 8 уроков, научу делать ботов и агентов.
    Ссылка в описании, старт в понедельник.

- id: ai_neg_2
  profile: ai
  expect_lead: false
  text: >
    Что такое ChatGPT и чем он отличается от DeepSeek? Хочу разобраться
    для себя, без внедрения.

- id: cross_ai_mp
  profile: ai
  expect_lead: true
  # «Кабинет ведём сами» — человек на кабинет не нужен, запрос только на бота.
  # Второй профиль mp здесь НЕ ожидается: это была ложная наводка (см. lessons.md п.5).
  text: >
    Нужен бот для автоответов на отзывы Ozon, около 400 отзывов в месяц,
    кто делает под ключ? Кабинет ведём сами, но с отзывами не справляемся.

- id: cross_ai_mp_real
  expect_profiles: [ai, mp]
  expect_lead: true
  text: >
    Ищу подрядчика на кабинет Ozon: нужен бот для автоответов на отзывы
    и человек, который ведёт карточки и рекламу. 40 SKU, сами не тянем. Кто под ключ?

- id: cross_mp_log
  expect_profiles: [mp, log]
  expect_lead: true
  text: >
    Ищу специалиста: нужно оформить карточки товара на Ozon и привезти
    партию из Китая (30 кг). Интересует и ведение кабинета, и поставка.
