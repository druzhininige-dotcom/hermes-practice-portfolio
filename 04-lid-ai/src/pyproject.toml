[project]
name = "lid-ai"
version = "0.1.0"
description = "Сбор лидов из Telegram-чатов: 4 профиля, мультиклиентность"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.15,<4",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "telethon>=1.36",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
markers = ["live: требует реального LLM-ключа (запуск: pytest -m live)"]

[tool.ruff]
line-length = 110
target-version = "py311"
